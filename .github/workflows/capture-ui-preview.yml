name: Capture product UI preview

on:
  push:
    branches:
      - ui-screenshot-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Start GenTether
        run: |
          GENTETHER_REPO=./fixtures/checkout-app npm start > /tmp/gentether-server.log 2>&1 &
          echo $! > /tmp/gentether-server.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gentether-server.log
          exit 1
      - name: Install screenshot browser
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Capture current interface
        run: |
          mkdir -p ui-preview
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage({viewport: {width: 1440, height: 1000}, deviceScaleFactor: 1});
          await page.emulateMedia({reducedMotion: 'no-preference'});
          await page.goto('http://127.0.0.1:8787', {waitUntil: 'networkidle'});
          await page.waitForTimeout(1800);
          await page.screenshot({path: 'ui-preview/01-hero.png'});

          await page.locator('#gate').scrollIntoViewIfNeeded();
          await page.waitForTimeout(1200);
          await page.screenshot({path: 'ui-preview/02-patch-gate.png'});

          await page.locator('#lineage').scrollIntoViewIfNeeded();
          await page.waitForTimeout(900);
          await page.locator('#trace').click();
          await page.waitForTimeout(1100);
          await page.screenshot({path: 'ui-preview/03-graph-evidence.png'});

          await page.locator('#agent').scrollIntoViewIfNeeded();
          await page.waitForTimeout(900);
          await page.screenshot({path: 'ui-preview/04-agent-tools.png'});

          await page.evaluate(() => window.scrollTo({top: 0, behavior: 'instant'}));
          await page.waitForTimeout(300);
          await page.screenshot({path: 'ui-preview/05-full-page.png', fullPage: true});
          await browser.close();
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: gentether-current-ui-preview
          path: ui-preview/*.png
          if-no-files-found: error
          retention-days: 7
