name: Capture product UI preview

on:
  push:
    branches:
      - ui-screenshot-preview
  pull_request:
    branches:
      - main
    paths:
      - "public/**"
      - "src/**"
      - "package.json"
      - ".github/workflows/capture-ui-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Start GenTether
        run: |
          GENTETHER_REPO=./fixtures/checkout-app npm start > /tmp/gentether-server.log 2>&1 &
          echo $! > /tmp/gentether-server.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gentether-server.log
          exit 1
      - name: Capture current interface with preinstalled Chrome
        run: |
          mkdir -p ui-preview
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          capture() {
            local url="$1"
            local output="$2"
            "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=5000 \
              --window-size=1440,1000 \
              --screenshot="$output" \
              "$url"
          }
          capture http://127.0.0.1:8787 ui-preview/01-hero.png
          capture http://127.0.0.1:8787/#gate ui-preview/02-patch-gate.png
          capture http://127.0.0.1:8787/#lineage ui-preview/03-graph-evidence.png
          capture http://127.0.0.1:8787/#agent ui-preview/04-agent-tools.png
      - uses: actions/upload-artifact@v4
        with:
          name: gentether-current-ui-preview
          path: ui-preview/*.png
          if-no-files-found: error
          retention-days: 7
