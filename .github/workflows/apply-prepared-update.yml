name: Apply prepared submission update

on:
  push:
    paths:
      - ".github/prepared-update/**"
      - ".github/workflows/apply-prepared-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack prepared update
        shell: bash
        run: |
          set -euo pipefail
          cat .github/prepared-update/chunk-* > /tmp/gentether-update.b64
          base64 -d /tmp/gentether-update.b64 > /tmp/gentether-update.tar.gz
          echo "dca1c37b6d48d0f339b84900a4e38c0f1f88ff57ff1823562f90585b104fa89e  /tmp/gentether-update.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gentether-update.tar.gz -C .

          rm -rf .github/prepared-update
          rm -f .github/workflows/apply-prepared-update.yml
          rm -f \
            docs/BUILD_REPORT.md \
            docs/DEMO_SCRIPT.md \
            docs/IDEATION.md \
            docs/SUBMISSION_CHECKLIST.md

          chmod +x \
            scripts/generate-narration.sh \
            scripts/verify-hydra-live.sh \
            scripts/init-hydra-data.sh \
            scripts/start-hydra.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare Hack Hydra submission and Remotion demo"
          git push
