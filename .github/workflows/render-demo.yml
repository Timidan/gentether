name: Render Remotion demo

on:
  push:
    paths:
      - "video/**"
      - "public/video/**"
      - "package.json"
      - ".github/workflows/render-demo.yml"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: npm run video:narration
      - run: npm run video:check
      - run: npm run audit
      - run: npm run video:render
      - uses: actions/upload-artifact@v4
        with:
          name: gentether-demo-video
          path: demo/gentether-demo.mp4
          if-no-files-found: error
          retention-days: 14
