name: Hallmark UI review

on:
  push:
    branches:
      - hallmark-workbench-redesign
  pull_request:
    branches:
      - main
    paths:
      - "public/**"
      - "scripts/audit-submission.mjs"
      - ".hallmark/**"
      - ".github/workflows/hallmark-ui-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run audit
      - name: Start GenTether
        run: |
          GENTETHER_REPO=./fixtures/checkout-app npm start > /tmp/gentether-server.log 2>&1 &
          echo $! > /tmp/gentether-server.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gentether-server.log
          exit 1
      - name: Capture Hallmark desktop and mobile review frames
        run: |
          npm install --no-save playwright-core@1.54.2
          mkdir -p hallmark-review
          export BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          node --input-type=module <<'EOF'
          import {chromium} from 'playwright-core';

          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.BROWSER,
            args: ['--no-sandbox', '--disable-gpu'],
          });

          async function capture({file, viewport, selector, trace = false}) {
            const page = await browser.newPage({viewport});
            await page.emulateMedia({reducedMotion: 'no-preference'});
            await page.goto('http://127.0.0.1:8787', {waitUntil: 'domcontentloaded'});
            await page.evaluate(() => document.fonts.ready);
            await page.waitForTimeout(900);
            if (selector) {
              await page.locator(selector).evaluate((element) => {
                const top = element.getBoundingClientRect().top + window.scrollY - 72;
                window.scrollTo({top: Math.max(0, top), behavior: 'instant'});
              });
              await page.waitForTimeout(500);
            }
            if (trace) {
              await page.locator('#trace').click();
              await page.waitForTimeout(650);
            }
            const overflow = await page.evaluate(() => ({
              viewport: window.innerWidth,
              document: document.documentElement.scrollWidth,
            }));
            if (overflow.document > overflow.viewport + 1) {
              throw new Error(`Horizontal overflow at ${viewport.width}px: ${JSON.stringify(overflow)}`);
            }
            await page.screenshot({path: file});
            await page.close();
          }

          await capture({file: 'hallmark-review/01-desktop-top.png', viewport: {width: 1440, height: 1000}});
          await capture({file: 'hallmark-review/02-desktop-gate.png', viewport: {width: 1440, height: 1000}, selector: '#gate'});
          await capture({file: 'hallmark-review/03-desktop-lineage.png', viewport: {width: 1440, height: 1000}, selector: '#lineage', trace: true});
          await capture({file: 'hallmark-review/04-tablet-768.png', viewport: {width: 768, height: 1024}, selector: '#gate'});
          await capture({file: 'hallmark-review/05-mobile-414.png', viewport: {width: 414, height: 896}, selector: '#gate'});
          await capture({file: 'hallmark-review/06-mobile-375.png', viewport: {width: 375, height: 812}, selector: '#gate'});
          await capture({file: 'hallmark-review/07-mobile-320.png', viewport: {width: 320, height: 700}, selector: '#gate'});
          await capture({file: 'hallmark-review/08-mobile-top-320.png', viewport: {width: 320, height: 700}});
          await browser.close();
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: hallmark-workbench-ui-review
          path: hallmark-review/*.png
          if-no-files-found: error
          retention-days: 7
